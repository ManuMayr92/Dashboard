                -webkit-font-smoothing: antialiased;

            }
            .staticrypt-page { width: 380px; max-width: 100%; padding: 14vh 16px 0; margin: auto; box-sizing: border-box; }
            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 18px;
                max-width: 380px;
                margin: 0 auto 100px;
                padding: 40px 36px 34px;
                text-align: center;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 0 rgba(255, 255, 255, 0.03) inset;
            }
            .staticrypt-lock { display: grid; place-items: center; width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 50%; background: var(--field); border: 1px solid var(--line); color: var(--accent); }
            .staticrypt-instructions { margin: 0 0 4px; }

            .staticrypt-title { font-size: 1.55em; font-weight: 600; letter-spacing: 0.01em; }
            .staticrypt-instructions p + p { margin-top: 6px; color: var(--muted); font-size: 0.95em; }
            .staticrypt-hr { margin: 22px 0; border: 0; border-top: 1px solid var(--line); }
            .staticrypt-password-container {
                position: relative;
                background: var(--field);
                width: 100%;
                border: 1px solid var(--line);
                border-radius: 12px;
                margin: 0 0 16px;
                box-sizing: border-box;
                transition: border-color 0.15s, box-shadow 0.15s;
            }
            .staticrypt-password-container:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(229, 160, 75, 0.18); }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                color: var(--ink);
                border: 0;
                box-sizing: border-box;
                font-size: 16px;
                font-family: inherit;
                outline: 0;
                padding: 15px 46px 15px 16px;
                width: 100%;
            }
            .staticrypt-form input::placeholder { color: var(--muted); opacity: 0.8; }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                width: 20px;
                padding: 13px;
                opacity: 0.6;
                filter: invert(1);
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 1; }
            label.staticrypt-remember { display: flex; align-items: center; margin: 0 0 18px; color: var(--muted); font-size: 0.95em; cursor: pointer; }
            .staticrypt-remember input[type="checkbox"] { width: 18px; height: 18px; margin: 0 12px 0 2px; accent-color: var(--accent); }
            .staticrypt-form .staticrypt-decrypt-button {
                outline: 0;
                background: var(--accent);
                width: 100%;
                border: 0;
                border-radius: 12px;
                padding: 15px;
                color: var(--accent-ink);
                font-size: 14px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                cursor: pointer;
                transition: filter 0.15s, transform 0.05s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { filter: brightness(1.08); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: translateY(1px); }
